<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Oregon Trail — AI Edition</title>
  <meta name="description" content="AI-native Oregon Trail. Every playthrough is unique — powered by Claude as the dungeon master. Free, browser-playable, no login required.">
  <link rel="canonical" href="https://trail.osi-cyber.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trail.osi-cyber.com/">
  <meta property="og:title" content="The Oregon Trail — AI Edition">
  <meta property="og:description" content="Every run is a different story. An AI dungeon master generates unique events grounded in real 1848 history. Free, no login.">
  <meta property="og:image" content="https://trail.osi-cyber.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The Oregon Trail — AI Edition">
  <meta name="twitter:description" content="AI-native Oregon Trail. No two runs are the same. Play free.">
  <meta name="twitter:image" content="https://trail.osi-cyber.com/og-image.png">
  <meta name="theme-color" content="#1a1a2e">
  <script defer data-domain="trail.osi-cyber.com" src="https://analytics.osi-cyber.com/js/script.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- Kaplay is self-hosted at /vendor/kaplay.mjs (IMPROVEMENT_ROADMAP §2) so
       the service worker can cache it and the game works offline. Warm the
       connection + parse the module early. main.js imports it on boot. -->
  <link rel="modulepreload" href="/vendor/kaplay.mjs">
  <!-- jsDelivr is the runtime CDN fallback in main.js if the self-hosted copy
       fails to load; preconnect so that fallback path isn't cold. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- 3D render layer (THREEJS_REBUILD_PLAN). Three.js + its jsm addons are
       self-hosted under /vendor/three (SW-cacheable, no build step), resolved via
       this importmap exactly like Kaplay's vendored ESM. The importmap MUST appear
       before any module script that imports "three". Deliberately NO eager
       modulepreload: 1.3MB of three core must not compete with kaplay + fonts on
       the first-paint critical path (plan R7) — main.js dynamic-imports the 3D
       layer at the END of boot instead, and the SW runtime-caches it for visit 2. -->
  <script type="importmap">
  { "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/jsm/"
  }}
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #html-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 100;
      background: rgba(10, 8, 6, 0.92);
      color: #f5e6c8;
      font-family: Georgia, 'Times New Roman', serif;
      overflow-y: auto;
    }
    #html-overlay.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Scoped by event.js/bitter_path.js only (via classList, alongside
       .active) — those two scenes paint a living tableau on the canvas
       behind the panel, so the full-screen scrim can go much lighter and
       let it read through. Every other #html-overlay consumer keeps the
       original near-opaque scrim above untouched. */
    #html-overlay.tableau {
      background: rgba(10, 8, 6, 0.3);
    }
    #html-overlay .overlay-content {
      max-width: 560px;
      margin: 60px auto;
      padding: 32px;
      border: 2px solid #d4a017;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(42, 31, 14, 0.97), rgba(26, 19, 10, 0.97));
      box-shadow: 0 0 0 1px rgba(212, 160, 23, 0.15) inset, 0 18px 44px rgba(0, 0, 0, 0.55);
      animation: panel-in 150ms ease-out;
    }
    #html-overlay .bp-cw-modal,
    #html-overlay .bp-scene {
      background: linear-gradient(180deg, rgba(36, 20, 14, 0.97), rgba(22, 12, 10, 0.97));
      box-shadow: 0 0 0 1px rgba(90, 26, 26, 0.35) inset, 0 18px 44px rgba(0, 0, 0, 0.6);
      animation: panel-in 150ms ease-out;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #html-overlay .overlay-content,
      #html-overlay .bp-cw-modal,
      #html-overlay .bp-scene {
        animation: none;
      }
    }
    #html-overlay h2 {
      color: #d4a017;
      font-size: 22px;
      margin-bottom: 16px;
      text-align: center;
    }
    #html-overlay p {
      line-height: 1.6;
      margin-bottom: 12px;
      font-size: 15px;
    }
    #html-overlay .choice-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      background: #2a1f0e;
      color: #f5e6c8;
      border: 1px solid #8b6914;
      border-radius: 3px;
      font-family: Georgia, serif;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    #html-overlay .choice-btn:hover {
      background: #3d2b14;
    }
    /* Rotate-to-landscape hint. The game is a 4:3 landscape layout; in portrait
       it letterboxes into a thin band and the type shrinks. Show only on touch
       devices held in portrait — it auto-hides the moment the device rotates
       (the media query stops matching), and a "play anyway" link sets .dismissed
       to escape for orientation-locked phones. Desktop never sees it. */
    #rotate-hint { display: none; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint:not(.dismissed) {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 300;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 32px;
        text-align: center;
        background: rgba(10, 8, 6, 0.97);
        color: #f5e6c8;
        font-family: Georgia, 'Times New Roman', serif;
      }
    }
    #rotate-hint .phone {
      width: 46px; height: 82px;
      border: 4px solid #d4a017;
      border-radius: 9px;
      animation: rotate-phone 2.2s ease-in-out infinite;
    }
    #rotate-hint h2 { color: #d4a017; font-size: 21px; }
    #rotate-hint p { font-size: 15px; line-height: 1.6; max-width: 300px; }
    #rotate-hint .dismiss {
      margin-top: 4px;
      color: #8b6914;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      background: none; border: none; font-family: Georgia, serif;
    }
    @keyframes rotate-phone {
      0%, 35% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    #newspaper-overlay { position: fixed; inset: 0; z-index: 200; display: none; background: rgba(0,0,0,0.9); overflow-y: auto; padding: 2rem; }
    #newspaper-overlay.active { display: flex; align-items: center; justify-content: center; }
    #tombstone-overlay { position: fixed; inset: 0; z-index: 200; display: none; background: rgba(0,0,0,0.9); overflow-y: auto; padding: 2rem; }
    #tombstone-overlay.active { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="a11y-status" role="status" aria-live="polite" style="position:absolute;left:-9999px;"></div>
  <noscript><p style="color:#f5e6c8;padding:2rem;">Oregon Trail AI requires JavaScript.</p></noscript>
  <div id="rotate-hint" role="dialog" aria-label="Rotate your device to landscape">
    <div class="phone" aria-hidden="true"></div>
    <h2>Rotate your device</h2>
    <p>The Oregon Trail plays best in landscape. Turn your phone sideways for full-size text.</p>
    <button class="dismiss" type="button" onclick="this.closest('#rotate-hint').classList.add('dismissed')">Play in portrait anyway</button>
  </div>
  <div id="html-overlay"><div class="overlay-content" id="overlay-content"></div></div>
  <div id="newspaper-overlay"></div>
  <div id="tombstone-overlay"></div>
  <!-- html2canvas (198KB) is now lazy-loaded on first newspaper share in
       scenes/newspaper.js (IMPROVEMENT_ROADMAP §2), not eagerly here. -->
  <script src="engine.js"></script>
  <script type="module" src="main.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
