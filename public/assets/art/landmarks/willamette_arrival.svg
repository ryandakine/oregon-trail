<svg xmlns="http://www.w3.org/2000/svg" width="340" height="180" viewBox="0 0 340 180">
  <defs>
    <filter id="valley-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1f1a16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="willamette-valley" filter="url(#valley-shadow)">
    <!-- Distant Cascades Peak (Mt. Hood silhouette in morning light) -->
    <polygon points="120,95 170,25 220,95" fill="#445b6b" stroke="#1f1a16" stroke-width="1.2"/>
    <!-- Glacial Snowcap -->
    <polygon points="170,25 155,48 165,55 170,50 178,56 185,46" fill="#f4f8fa" stroke="#1f1a16" stroke-width="0.8"/>

    <!-- Lush Rolling Evergreen Foothills -->
    <path d="M 0 115 C 60 90, 130 110, 200 95 C 260 85, 300 98, 340 92 L 340 135 L 0 135 Z"
          fill="#2b472e" stroke="#1f1a16" stroke-width="1.4"/>
    <!-- Douglas Fir Silhouette Ridges -->
    <path d="M 15 110 L 20 98 L 25 110 M 45 105 L 50 92 L 55 105 M 85 108 L 90 95 L 95 108 M 235 95 L 240 82 L 245 95 M 275 98 L 280 85 L 285 98"
          stroke="#1b331e" stroke-width="2" stroke-linecap="round"/>

    <!-- Willamette Valley Emerald Terrace & Pasture -->
    <path d="M 0 130 C 80 120, 200 125, 340 120 L 340 176 L 0 176 Z"
          fill="#3e6332" stroke="#1f1a16" stroke-width="1.4"/>

    <!-- Tended Apple Orchard Rows on West Slope -->
    <g fill="#2d4a25" stroke="#1f1a16" stroke-width="1">
      <path d="M 25 145 C 22 135, 32 128, 38 135 C 44 128, 54 135, 51 145 Z"/>
      <rect x="36" y="145" width="4" height="10" fill="#4a2e16"/>
      <path d="M 65 142 C 62 132, 72 125, 78 132 C 84 125, 94 132, 91 142 Z"/>
      <rect x="76" y="142" width="4" height="12" fill="#4a2e16"/>
      <path d="M 105 146 C 102 136, 112 129, 118 136 C 124 129, 134 136, 131 146 Z"/>
      <rect x="116" y="146" width="4" height="10" fill="#4a2e16"/>
    </g>

    <!-- Homestead Pioneer Cabin (Hewn timber, cedar shakes, stone chimney) -->
    <!-- Cabin Body -->
    <rect x="175" y="120" width="85" height="46" fill="#694627" stroke="#1f1a16" stroke-width="1.6"/>
    <!-- Interlocking corner notching & horizontal log courses -->
    <path d="M 175 128 L 260 128 M 175 136 L 260 136 M 175 144 L 260 144 M 175 152 L 260 152 M 175 160 L 260 160"
          stroke="#422913" stroke-width="1.2"/>

    <!-- Cabin Door & Multi-pane Glass Window -->
    <rect x="205" y="134" width="18" height="32" fill="#361f0d" stroke="#1f1a16" stroke-width="1.2"/>
    <circle cx="209" cy="150" r="1.5" fill="#d9aa55"/> <!-- Latch -->
    <rect x="233" y="132" width="16" height="18" fill="#d4e6f1" stroke="#1f1a16" stroke-width="1.2"/>
    <line x1="241" y1="132" x2="241" y2="150" stroke="#1f1a16" stroke-width="1"/>
    <line x1="233" y1="141" x2="249" y2="141" stroke="#1f1a16" stroke-width="1"/>

    <!-- Cedar Shake Pitched Roof -->
    <polygon points="170,120 217,94 265,120" fill="#4a2d18" stroke="#1f1a16" stroke-width="1.6"/>
    <!-- Overhanging eave lines -->
    <path d="M 174 116 L 261 116 M 180 110 L 255 110 M 190 104 L 245 104" stroke="#2d1909" stroke-width="1"/>

    <!-- River Stone Hearth Chimney on Gabled Wall -->
    <rect x="162" y="90" width="16" height="65" fill="#756b62" stroke="#1f1a16" stroke-width="1.4"/>
    <!-- Stonework masonry inking -->
    <path d="M 162 100 L 178 100 M 162 110 L 178 110 M 162 120 L 178 120 M 162 130 L 178 130"
          stroke="#423b36" stroke-width="1"/>
    <!-- Flue cap -->
    <rect x="160" y="87" width="20" height="4" fill="#3b3530" stroke="#1f1a16" stroke-width="1"/>

    <!-- Woodsmoke Plume Curling into Sky -->
    <path d="M 170 87 C 168 76, 175 68, 169 58 C 163 48, 178 38, 184 25"
          fill="none" stroke="#d5dbdb" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M 171 87 C 169 77, 174 69, 170 59 C 165 49, 177 39, 182 27"
          fill="none" stroke="#f2f4f4" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- Split-Rail Snake Fence (Virginia rail fence zig-zag) -->
    <path d="M 130 168 L 150 162 L 170 168 L 190 162" stroke="#5a3d24" stroke-width="2.5" fill="none"/>
    <path d="M 130 172 L 150 166 L 170 172 L 190 166" stroke="#5a3d24" stroke-width="2.5" fill="none"/>
    <path d="M 265 166 L 285 160 L 305 166 L 325 160 L 340 164" stroke="#5a3d24" stroke-width="2.5" fill="none"/>
    <path d="M 265 170 L 285 164 L 305 170 L 325 164 L 340 168" stroke="#5a3d24" stroke-width="2.5" fill="none"/>
  </g>
</svg>
