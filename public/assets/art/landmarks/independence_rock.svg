<svg xmlns="http://www.w3.org/2000/svg" width="340" height="180" viewBox="0 0 340 180">
  <defs>
    <filter id="granite-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1f1a16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="independence-rock" filter="url(#granite-shadow)">
    <!-- Distant Sweetwater River / Granite Range Ridge -->
    <path d="M 0 160 L 60 145 L 120 155 L 200 148 L 280 156 L 340 148 L 340 165 L 0 165 Z"
          fill="#8c7866" stroke="#1f1a16" stroke-width="1.2"/>

    <!-- Massive Granite Turtle-Back Dome (Monolith) -->
    <path d="M 20 174 C 25 105, 75 45, 170 45 C 265 45, 315 105, 320 174 Z"
          fill="#9e8a78" stroke="#1f1a16" stroke-width="2" stroke-linejoin="round"/>

    <!-- Granite Exfoliation Shells / Weathered Curved Strata -->
    <path d="M 45 160 C 50 115, 95 62, 170 62 C 245 62, 290 115, 295 160"
          stroke="#736152" stroke-width="2.5" fill="none"/>
    <path d="M 75 145 C 80 118, 115 82, 170 82 C 225 82, 260 118, 265 145"
          stroke="#615042" stroke-width="2" fill="none"/>
    <path d="M 110 130 C 115 115, 135 98, 170 98 C 205 98, 225 115, 230 130"
          stroke="#736152" stroke-width="1.8" fill="none"/>

    <!-- Shaded Eastern Slope (Woodcut Engraving Hatching) -->
    <path d="M 175 48 C 255 48, 305 102, 316 172 L 316 174 C 265 174, 215 174, 175 174 Z"
          fill="#1f1a16" opacity="0.18"/>
    <path d="M 185 52 L 200 170 M 205 56 L 225 170 M 225 64 L 250 170 M 245 74 L 275 170 M 265 88 L 298 170"
          stroke="#1f1a16" stroke-width="1.2" opacity="0.35"/>

    <!-- Pioneer Inscriptions & Carvings ("Register of the Desert") -->
    <!-- Carved stone panels & initials etched by westward emigrants -->
    <g fill="#3b2f26" stroke="#1f1a16" stroke-width="0.6" font-family="serif" font-weight="bold" font-size="9" letter-spacing="1.5">
      <text x="130" y="125" transform="rotate(-6 130 125)">1848</text>
      <text x="185" y="118" transform="rotate(4 185 118)">OREGON</text>
      <text x="145" y="142" font-size="7">M. W. REED</text>
      <text x="195" y="136" font-size="7">J. WOOD</text>
      <text x="105" y="152" font-size="6">JULY 4</text>
      <text x="235" y="148" font-size="6">APPLEGATE</text>
    </g>

    <!-- Fissures and Lichen Patches -->
    <path d="M 95 85 C 102 98, 98 115, 105 132" stroke="#1f1a16" stroke-width="1.3" fill="none"/>
    <path d="M 235 90 C 228 105, 232 120, 226 138" stroke="#1f1a16" stroke-width="1.3" fill="none"/>

    <!-- Prairie Sagebrush Tufts at base -->
    <path d="M 12 174 C 15 168, 24 168, 27 174" fill="#586b4d" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 85 174 C 88 166, 100 166, 103 174" fill="#586b4d" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 290 174 C 293 167, 304 167, 307 174" fill="#586b4d" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 325 174 C 327 169, 335 169, 337 174" fill="#586b4d" stroke="#1f1a16" stroke-width="1"/>

    <!-- Wagon Rut Trail traversing foreground -->
    <path d="M 0 177 C 80 173, 240 173, 340 177" stroke="#6b513a" stroke-width="3" fill="none"/>
    <path d="M 0 180 C 80 176, 240 176, 340 180" stroke="#1f1a16" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
</svg>
