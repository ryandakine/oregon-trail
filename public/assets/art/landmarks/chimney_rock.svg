<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <filter id="monument-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1f1a16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="chimney-rock" filter="url(#monument-shadow)">
    <!-- Distant flanking buttes/ridges -->
    <path d="M 0 160 L 45 135 L 75 138 L 105 160 Z" fill="#b08b68" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 215 160 L 245 138 L 285 142 L 320 160 Z" fill="#b08b68" stroke="#1f1a16" stroke-width="1.2"/>
    <!-- Strata bands on flanking bluffs -->
    <path d="M 20 148 L 90 148 M 230 150 L 305 150" stroke="#7a5538" stroke-width="1"/>

    <!-- Sloping Conical Talus Base (massive apron rising from prairie) -->
    <path d="M 50 178 L 138 95 L 182 95 L 270 178 Z"
          fill="#cda279" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Sedimentary Strata Layers with Inking -->
    <path d="M 72 165 C 120 163, 200 163, 248 165" stroke="#946542" stroke-width="3" fill="none"/>
    <path d="M 88 150 C 130 148, 190 148, 232 150" stroke="#744a2b" stroke-width="2.5" fill="none"/>
    <path d="M 104 135 C 135 133, 185 133, 216 135" stroke="#946542" stroke-width="2.5" fill="none"/>
    <path d="M 120 120 C 140 119, 180 119, 200 120" stroke="#744a2b" stroke-width="2" fill="none"/>
    <path d="M 132 105 C 145 104, 175 104, 188 105" stroke="#5a351b" stroke-width="2" fill="none"/>

    <!-- Woodcut contour hatching on eastern shaded flank of conical base -->
    <path d="M 160 98 L 195 174 M 172 98 L 215 174 M 184 102 L 235 174 M 196 110 L 255 174"
          stroke="#1f1a16" stroke-width="1.2" opacity="0.35"/>

    <!-- Slender Vertical Sandstone Spire (The Chimney) -->
    <!-- Shadow side (East) -->
    <path d="M 157 20 L 168 18 L 170 95 L 157 95 Z"
          fill="#704423" stroke="#1f1a16" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Sunlit side (West) -->
    <path d="M 148 22 L 157 20 L 157 95 L 146 95 Z"
          fill="#d8b28a" stroke="#1f1a16" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Weathered Spire Summit Crown / Jagged tip -->
    <path d="M 147 24 L 152 14 L 158 13 L 163 17 L 169 22 Z"
          fill="#94633e" stroke="#1f1a16" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 152 14 L 155 8 L 158 13 Z" fill="#e6c49f" stroke="#1f1a16" stroke-width="1"/>

    <!-- Vertical Weathering Fissures on the Spire -->
    <path d="M 154 18 L 154 94" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 162 22 L 163 88" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 150 35 L 151 75" stroke="#94633e" stroke-width="0.8"/>

    <!-- Horizontal Strata Notches on Spire -->
    <path d="M 147 38 L 169 38 M 146 55 L 170 55 M 146 72 L 170 72" stroke="#1f1a16" stroke-width="1.1"/>

    <!-- Pioneer trail rut & prairie scrub in foreground -->
    <path d="M 30 178 C 80 174, 180 176, 290 178" stroke="#875f3a" stroke-width="2.5" fill="none"/>
    <path d="M 35 180 C 85 177, 185 178, 295 180" stroke="#1f1a16" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
</svg>
