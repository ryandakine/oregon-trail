<svg xmlns="http://www.w3.org/2000/svg" width="96" height="116" viewBox="0 0 96 116">
  <defs>
    <filter id="tree-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1f1a16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="cottonwood" filter="url(#tree-shadow)">
    <!-- Root flare & Gnarly Weathered Trunk -->
    <path d="M 40 114 C 43 98, 42 78, 38 64 C 36 53, 40 43, 48 36 C 56 43, 60 53, 58 64 C 54 78, 53 98, 56 114 C 49 115, 45 115, 40 114 Z" 
          fill="#523220" stroke="#1f1a16" stroke-width="2" stroke-linejoin="round"/>
    <!-- Bark fissures and engraving hatch lines -->
    <path d="M 44 110 C 46 95, 45 80, 43 67" fill="none" stroke="#251609" stroke-width="1.3"/>
    <path d="M 50 111 C 52 97, 53 78, 51 66" fill="none" stroke="#251609" stroke-width="1.3"/>
    <path d="M 47 95 C 48 88, 48 80, 46 74" fill="none" stroke="#251609" stroke-width="1"/>
    <!-- Surface roots digging into prairie soil -->
    <path d="M 41 113 L 34 116 M 55 113 L 62 116" stroke="#1f1a16" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Major Branching Limbs reaching through foliage -->
    <path d="M 43 64 C 31 54, 21 48, 14 39" fill="none" stroke="#3d2311" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 28 51 C 21 46, 17 43, 11 41" fill="none" stroke="#3d2311" stroke-width="2" stroke-linecap="round"/>
    <path d="M 53 64 C 65 54, 75 48, 82 39" fill="none" stroke="#3d2311" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 68 51 C 75 46, 79 43, 85 41" fill="none" stroke="#3d2311" stroke-width="2" stroke-linecap="round"/>
    <path d="M 48 46 C 45 35, 47 26, 48 18" fill="none" stroke="#3d2311" stroke-width="3" stroke-linecap="round"/>

    <!-- Layer 1: Deep Background Shadow Canopy (irregular lobed masses) -->
    <path d="M 22 48 C 16 42, 17 32, 25 28 C 24 20, 32 14, 40 18 C 45 10, 56 10, 62 17 C 70 13, 79 20, 77 28 C 85 32, 86 42, 80 48 C 76 56, 68 58, 62 55 C 55 60, 45 60, 39 55 C 32 58, 25 56, 22 48 Z"
          fill="#253822" stroke="#172415" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Layer 2: Midground Foliage Mass (scalloped botanical lobes) -->
    <path d="M 16 42 C 10 34, 13 24, 23 23 C 26 15, 36 12, 44 18 C 50 11, 62 12, 67 19 C 76 15, 85 22, 85 31 C 92 37, 89 48, 81 52 C 77 58, 67 59, 60 55 C 53 60, 42 60, 36 55 C 28 59, 19 55, 16 48 C 11 47, 12 43, 16 42 Z"
          fill="#3b5734" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Layer 3: Foreground Sunlit Leaf Masses (lobed organic clusters) -->
    <!-- Left Fore-lobe -->
    <path d="M 20 36 C 18 29, 26 24, 32 27 C 37 23, 44 26, 43 32 C 46 36, 42 43, 36 44 C 30 46, 22 43, 20 36 Z"
          fill="#52794a" stroke="#1f1a16" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Right Fore-lobe -->
    <path d="M 54 33 C 54 26, 62 23, 67 27 C 73 24, 80 28, 78 35 C 81 41, 76 47, 69 46 C 63 46, 56 42, 54 33 Z"
          fill="#52794a" stroke="#1f1a16" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Crown / Top Fore-lobe -->
    <path d="M 37 24 C 36 17, 44 13, 50 16 C 56 13, 62 17, 61 24 C 62 29, 56 33, 49 32 C 42 33, 37 29, 37 24 Z"
          fill="#638f5a" stroke="#1f1a16" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Center Lower Fore-lobe -->
    <path d="M 36 43 C 35 36, 44 33, 50 36 C 56 34, 61 38, 59 44 C 58 49, 52 52, 47 51 C 41 52, 36 48, 36 43 Z"
          fill="#5a8451" stroke="#1f1a16" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Woodcut Engraving Scallop Inking & Highlights -->
    <path d="M 23 31 C 26 28, 30 28, 33 31" fill="none" stroke="#7eb073" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 25 36 C 28 34, 33 34, 36 37" fill="none" stroke="#7eb073" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 42 18 C 46 15, 51 15, 55 18" fill="none" stroke="#90c784" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 60 29 C 64 26, 69 26, 72 29" fill="none" stroke="#7eb073" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 62 37 C 66 34, 70 34, 74 37" fill="none" stroke="#7eb073" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 41 39 C 45 36, 51 36, 55 39" fill="none" stroke="#7eb073" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Shadow Scallop Inking under lobes -->
    <path d="M 19 46 C 24 49, 30 49, 34 46" fill="none" stroke="#172415" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 63 46 C 68 49, 74 49, 78 46" fill="none" stroke="#172415" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 40 54 C 46 57, 53 57, 58 54" fill="none" stroke="#172415" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
