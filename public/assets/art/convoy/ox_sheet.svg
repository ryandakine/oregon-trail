<svg xmlns="http://www.w3.org/2000/svg" width="320" height="50" viewBox="0 0 320 50">
  <defs>
    <pattern id="ox-hatch" width="4" height="4" patternTransform="rotate(-40 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1f1a16" stroke-width="0.8" opacity="0.35" />
    </pattern>
  </defs>

  <!-- ==================== FRAME 0: Contact (80x50, x=0) ==================== -->
  <g id="frame-0" transform="translate(0, 0)">
    <!-- Rear hooves & legs -->
    <!-- Far rear leg (planting) -->
    <path d="M 60 25 L 61 44 L 66 44 L 64 25 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="61" y="42" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Far front leg (stride back) -->
    <path d="M 32 24 L 35 44 L 40 44 L 36 24 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="35" y="42" width="5" height="3" rx="0.5" fill="#1f1a16"/>

    <!-- Tail & switch -->
    <path d="M 68 18 C 72 24, 71 34, 73 38" fill="none" stroke="#2b1a0c" stroke-width="1.5"/>
    <polygon points="72,36 75,44 71,43" fill="#1f1a16"/>

    <!-- Torso / Barrel / Haunches / Muscular Hump -->
    <!-- Massive body mass -->
    <path d="M 22 17 
             C 24 10, 28 6, 36 7 
             C 42 7, 44 11, 48 12
             C 56 12, 64 14, 68 18
             C 71 22, 70 28, 66 31
             C 58 33, 44 33, 34 33
             C 26 33, 20 28, 20 22 Z"
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Cream / pale belly underbelly highlight -->
    <path d="M 36 28 C 45 28, 55 28, 62 26 C 58 31, 42 32, 36 30 Z" fill="#e2d7c3" opacity="0.85"/>
    <!-- Flank shadow cross-hatching -->
    <path d="M 45 16 C 54 16, 62 18, 66 22 L 64 29 C 55 29, 45 27, 45 16 Z" fill="url(#ox-hatch)"/>

    <!-- Shoulder Hump curve -->
    <path d="M 28 8 C 33 6, 38 7, 40 10 C 36 12, 30 11, 28 8 Z" fill="#6d432e"/>

    <!-- Near legs -->
    <!-- Near rear leg (reaching forward) -->
    <path d="M 53 25 L 50 42 L 55 42 L 58 25 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="50" y="41" width="5.5" height="3" rx="0.5" fill="#1f1a16"/> <!-- Cloven hoof -->
    <!-- Near front leg (reaching forward) -->
    <path d="M 24 24 L 20 42 L 25 42 L 28 24 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="20" y="41" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>

    <!-- Thick Neck & Hanging Dewlap Folds -->
    <path d="M 18 16 C 22 17, 24 24, 22 28 C 18 28, 14 24, 16 18 Z" fill="#4a2c0f" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 16 23 C 19 25, 21 27, 20 30" fill="none" stroke="#1f1a16" stroke-width="1.2"/>

    <!-- Head & Muzzle (lowered in draft posture) -->
    <path d="M 8 20 C 6 17, 10 13, 16 14 C 18 16, 18 20, 16 23 C 12 25, 9 24, 8 20 Z" 
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <!-- Broad Pale Muzzle -->
    <ellipse cx="9" cy="22" rx="4" ry="3" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <ellipse cx="8" cy="22" rx="1" ry="0.6" fill="#1f1a16"/> <!-- Nostril -->
    <circle cx="14" cy="17" r="1.5" fill="#1f1a16"/> <!-- Eye -->
    <ellipse cx="18" cy="15" rx="2" ry="1.2" fill="#38220f" stroke="#1f1a16" stroke-width="0.8"/> <!-- Ear -->

    <!-- Sweeping Lyre Horns with Dark Tips -->
    <path d="M 15 13 C 13 8, 8 6, 4 8 C 8 8, 12 11, 14 14 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 4 8 C 6 8, 7 9, 6 10 Z" fill="#1f1a16"/> <!-- Horn tip -->
    <path d="M 17 13 C 19 8, 23 6, 27 7 C 23 8, 20 11, 18 14 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 27 7 C 25 8, 24 9, 25 10 Z" fill="#1f1a16"/>

    <!-- Wooden Yoke resting across shoulders with iron ring -->
    <polygon points="28,6 38,6 36,9 26,9" fill="#8b5a2b" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 27 9 C 27 16, 33 16, 33 9" fill="none" stroke="#a4723e" stroke-width="1.5"/> <!-- Hickory bow -->
    <circle cx="33" cy="8" r="1.5" fill="none" stroke="#1f1a16" stroke-width="1"/> <!-- Iron ring -->
    <!-- Trace chain trailing back to wagon tongue -->
    <line x1="34" y1="8" x2="78" y2="28" stroke="#1f1a16" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== FRAME 1: Pass 1 (80x50, x=80) ==================== -->
  <g id="frame-1" transform="translate(80, 0)">
    <!-- Far rear leg (lifting forward) -->
    <path d="M 58 25 L 56 42 L 61 42 L 62 25 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="56" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Far front leg (planting) -->
    <path d="M 33 24 L 32 44 L 37 44 L 37 24 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="32" y="42" width="5" height="3" rx="0.5" fill="#1f1a16"/>

    <path d="M 68 18 C 72 24, 71 34, 73 38" fill="none" stroke="#2b1a0c" stroke-width="1.5"/>
    <polygon points="72,36 75,44 71,43" fill="#1f1a16"/>

    <path d="M 22 18 C 24 11, 28 7, 36 8 C 42 8, 44 12, 48 13 C 56 13, 64 15, 68 19 C 71 23, 70 29, 66 32 C 58 34, 44 34, 34 34 C 26 34, 20 29, 20 23 Z"
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 36 29 C 45 29, 55 29, 62 27 C 58 32, 42 33, 36 31 Z" fill="#e2d7c3" opacity="0.85"/>
    <path d="M 45 17 C 54 17, 62 19, 66 23 L 64 30 C 55 30, 45 28, 45 17 Z" fill="url(#ox-hatch)"/>
    <path d="M 28 9 C 33 7, 38 8, 40 11 C 36 13, 30 12, 28 9 Z" fill="#6d432e"/>

    <!-- Near legs -->
    <!-- Near rear leg (passing under center) -->
    <path d="M 54 25 L 53 43 L 58 43 L 59 25 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="53" y="42" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Near front leg (lifting and bending at knee) -->
    <path d="M 25 24 L 27 35 L 23 41 L 28 41 L 30 34 L 29 24 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="23" y="39.5" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>

    <!-- Neck & Dewlap (bobbing down slightly) -->
    <path d="M 18 17 C 22 18, 24 25, 22 29 C 18 29, 14 25, 16 19 Z" fill="#4a2c0f" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 16 24 C 19 26, 21 28, 20 31" fill="none" stroke="#1f1a16" stroke-width="1.2"/>

    <!-- Head & Muzzle (y=21, lowered bob) -->
    <path d="M 8 21 C 6 18, 10 14, 16 15 C 18 17, 18 21, 16 24 C 12 26, 9 25, 8 21 Z" 
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <ellipse cx="9" cy="23" rx="4" ry="3" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <ellipse cx="8" cy="23" rx="1" ry="0.6" fill="#1f1a16"/>
    <circle cx="14" cy="18" r="1.5" fill="#1f1a16"/>
    <ellipse cx="18" cy="16" rx="2" ry="1.2" fill="#38220f" stroke="#1f1a16" stroke-width="0.8"/>

    <!-- Horns -->
    <path d="M 15 14 C 13 9, 8 7, 4 9 C 8 9, 12 12, 14 15 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 4 9 C 6 9, 7 10, 6 11 Z" fill="#1f1a16"/>
    <path d="M 17 14 C 19 9, 23 7, 27 8 C 23 9, 20 12, 18 15 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 27 8 C 25 9, 24 10, 25 11 Z" fill="#1f1a16"/>

    <polygon points="28,7 38,7 36,10 26,10" fill="#8b5a2b" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 27 10 C 27 17, 33 17, 33 10" fill="none" stroke="#a4723e" stroke-width="1.5"/>
    <circle cx="33" cy="9" r="1.5" fill="none" stroke="#1f1a16" stroke-width="1"/>
    <line x1="34" y1="9" x2="78" y2="29" stroke="#1f1a16" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== FRAME 2: Opposite Contact (80x50, x=160) ==================== -->
  <g id="frame-2" transform="translate(160, 0)">
    <!-- Far rear leg (reaching forward) -->
    <path d="M 55 25 L 51 42 L 56 42 L 59 25 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="51" y="41" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Far front leg (reaching forward) -->
    <path d="M 25 24 L 21 42 L 26 42 L 29 24 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="21" y="41" width="5" height="3" rx="0.5" fill="#1f1a16"/>

    <path d="M 68 18 C 72 24, 71 34, 73 38" fill="none" stroke="#2b1a0c" stroke-width="1.5"/>
    <polygon points="72,36 75,44 71,43" fill="#1f1a16"/>

    <path d="M 22 17 C 24 10, 28 6, 36 7 C 42 7, 44 11, 48 12 C 56 12, 64 14, 68 18 C 71 22, 70 28, 66 31 C 58 33, 44 33, 34 33 C 26 33, 20 28, 20 22 Z"
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 36 28 C 45 28, 55 28, 62 26 C 58 31, 42 32, 36 30 Z" fill="#e2d7c3" opacity="0.85"/>
    <path d="M 45 16 C 54 16, 62 18, 66 22 L 64 29 C 55 29, 45 27, 45 16 Z" fill="url(#ox-hatch)"/>
    <path d="M 28 8 C 33 6, 38 7, 40 10 C 36 12, 30 11, 28 8 Z" fill="#6d432e"/>

    <!-- Near legs -->
    <!-- Near rear leg (planting firmly) -->
    <path d="M 61 25 L 63 44 L 68 44 L 66 25 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="63" y="42" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Near front leg (stride back) -->
    <path d="M 32 24 L 35 44 L 40 44 L 36 24 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="35" y="42" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>

    <!-- Thick Neck & Hanging Dewlap -->
    <path d="M 18 16 C 22 17, 24 24, 22 28 C 18 28, 14 24, 16 18 Z" fill="#4a2c0f" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 16 23 C 19 25, 21 27, 20 30" fill="none" stroke="#1f1a16" stroke-width="1.2"/>

    <!-- Head & Muzzle (y=20, raised slightly) -->
    <path d="M 8 20 C 6 17, 10 13, 16 14 C 18 16, 18 20, 16 23 C 12 25, 9 24, 8 20 Z" 
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <ellipse cx="9" cy="22" rx="4" ry="3" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <ellipse cx="8" cy="22" rx="1" ry="0.6" fill="#1f1a16"/>
    <circle cx="14" cy="17" r="1.5" fill="#1f1a16"/>
    <ellipse cx="18" cy="15" rx="2" ry="1.2" fill="#38220f" stroke="#1f1a16" stroke-width="0.8"/>

    <!-- Horns -->
    <path d="M 15 13 C 13 8, 8 6, 4 8 C 8 8, 12 11, 14 14 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 4 8 C 6 8, 7 9, 6 10 Z" fill="#1f1a16"/>
    <path d="M 17 13 C 19 8, 23 6, 27 7 C 23 8, 20 11, 18 14 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 27 7 C 25 8, 24 9, 25 10 Z" fill="#1f1a16"/>

    <polygon points="28,6 38,6 36,9 26,9" fill="#8b5a2b" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 27 9 C 27 16, 33 16, 33 9" fill="none" stroke="#a4723e" stroke-width="1.5"/>
    <circle cx="33" cy="8" r="1.5" fill="none" stroke="#1f1a16" stroke-width="1"/>
    <line x1="34" y1="8" x2="78" y2="28" stroke="#1f1a16" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ==================== FRAME 3: Pass 2 (80x50, x=240) ==================== -->
  <g id="frame-3" transform="translate(240, 0)">
    <!-- Far rear leg (planting) -->
    <path d="M 59 25 L 60 44 L 65 44 L 64 25 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="60" y="42" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Far front leg (lifting knee) -->
    <path d="M 26 24 L 28 35 L 24 41 L 29 41 L 31 34 L 30 24 Z" fill="#38220f" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="24" y="39.5" width="5" height="3" rx="0.5" fill="#1f1a16"/>

    <path d="M 68 18 C 72 24, 71 34, 73 38" fill="none" stroke="#2b1a0c" stroke-width="1.5"/>
    <polygon points="72,36 75,44 71,43" fill="#1f1a16"/>

    <path d="M 22 17.5 C 24 10.5, 28 6.5, 36 7.5 C 42 7.5, 44 11.5, 48 12.5 C 56 12.5, 64 14.5, 68 18.5 C 71 22.5, 70 28.5, 66 31.5 C 58 33.5, 44 33.5, 34 33.5 C 26 33.5, 20 28.5, 20 22.5 Z"
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 36 28.5 C 45 28.5, 55 28.5, 62 26.5 C 58 31.5, 42 32.5, 36 30.5 Z" fill="#e2d7c3" opacity="0.85"/>
    <path d="M 45 16.5 C 54 16.5, 62 18.5, 66 22.5 L 64 29.5 C 55 29.5, 45 27.5, 45 16.5 Z" fill="url(#ox-hatch)"/>
    <path d="M 28 8.5 C 33 6.5, 38 7.5, 40 10.5 C 36 12.5, 30 11.5, 28 8.5 Z" fill="#6d432e"/>

    <!-- Near legs -->
    <!-- Near rear leg (lifting forward) -->
    <path d="M 57 25 L 55 42 L 60 42 L 61 25 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="55" y="40" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Near front leg (planting) -->
    <path d="M 33 24 L 32 44 L 37 44 L 37 24 Z" fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <rect x="32" y="42" width="5.5" height="3" rx="0.5" fill="#1f1a16"/>

    <!-- Neck & Dewlap -->
    <path d="M 18 16.5 C 22 17.5, 24 24.5, 22 28.5 C 18 28.5, 14 24.5, 16 18.5 Z" fill="#4a2c0f" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 16 23.5 C 19 25.5, 21 27.5, 20 30.5" fill="none" stroke="#1f1a16" stroke-width="1.2"/>

    <!-- Head & Muzzle -->
    <path d="M 8 20.5 C 6 17.5, 10 13.5, 16 14.5 C 18 16.5, 18 20.5, 16 23.5 C 12 25.5, 9 24.5, 8 20.5 Z" 
          fill="#5c3826" stroke="#1f1a16" stroke-width="1.5"/>
    <ellipse cx="9" cy="22.5" rx="4" ry="3" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <ellipse cx="8" cy="22.5" rx="1" ry="0.6" fill="#1f1a16"/>
    <circle cx="14" cy="17.5" r="1.5" fill="#1f1a16"/>
    <ellipse cx="18" cy="15.5" rx="2" ry="1.2" fill="#38220f" stroke="#1f1a16" stroke-width="0.8"/>

    <!-- Horns -->
    <path d="M 15 13.5 C 13 8.5, 8 6.5, 4 8.5 C 8 8.5, 12 11.5, 14 14.5 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 4 8.5 C 6 8.5, 7 9.5, 6 10.5 Z" fill="#1f1a16"/>
    <path d="M 17 13.5 C 19 8.5, 23 6.5, 27 7.5 C 23 8.5, 20 11.5, 18 14.5 Z" fill="#e2d7c3" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 27 7.5 C 25 8.5, 24 9.5, 25 10.5 Z" fill="#1f1a16"/>

    <polygon points="28,6.5 38,6.5 36,9.5 26,9.5" fill="#8b5a2b" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 27 9.5 C 27 16.5, 33 16.5, 33 9.5" fill="none" stroke="#a4723e" stroke-width="1.5"/>
    <circle cx="33" cy="8.5" r="1.5" fill="none" stroke="#1f1a16" stroke-width="1"/>
    <line x1="34" y1="8.5" x2="78" y2="28.5" stroke="#1f1a16" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
</svg>
