<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <defs>
    <filter id="shadow-f" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#1f1a16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g id="front-wheel" filter="url(#shadow-f)">
    <!-- Outer Iron Tire -->
    <circle cx="22" cy="22" r="21" fill="#1f1a16" stroke="#2d2621" stroke-width="1"/>
    <!-- Iron Tire inner lip -->
    <circle cx="22" cy="22" r="19" fill="#8b5a2b" stroke="#1f1a16" stroke-width="1"/>
    <!-- Wooden Felloe Rim -->
    <circle cx="22" cy="22" r="17" fill="#633e1a" stroke="#1f1a16" stroke-width="1"/>

    <!-- 10 Tapered Wooden Spokes (36 deg intervals) -->
    <!-- 0 deg -->
    <polygon points="21,22 23,22 23.2,5 20.8,5" fill="#a4723e" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 36 deg -->
    <polygon points="22,22 22,22 32,8.3 30.5,7.2" fill="#8b5a2b" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 72 deg -->
    <polygon points="22,22 22,22 38,16.8 37.3,14.7" fill="#8b5a2b" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 108 deg -->
    <polygon points="22,22 22,22 38,27.2 37.3,29.3" fill="#633e1a" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 144 deg -->
    <polygon points="22,22 22,22 32,35.7 30.5,36.8" fill="#633e1a" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 180 deg -->
    <polygon points="21,22 23,22 23.2,39 20.8,39" fill="#4a2c0f" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 216 deg -->
    <polygon points="22,22 22,22 12,35.7 13.5,36.8" fill="#4a2c0f" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 252 deg -->
    <polygon points="22,22 22,22 6,27.2 6.7,29.3" fill="#633e1a" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 288 deg -->
    <polygon points="22,22 22,22 6,16.8 6.7,14.7" fill="#8b5a2b" stroke="#1f1a16" stroke-width="0.7"/>
    <!-- 324 deg -->
    <polygon points="22,22 22,22 12,8.3 13.5,7.2" fill="#a4723e" stroke="#1f1a16" stroke-width="0.7"/>

    <!-- Cast-Iron Hub Box with Linchpin -->
    <circle cx="22" cy="22" r="6.5" fill="#1f1a16" stroke="#2d2621" stroke-width="1"/>
    <circle cx="22" cy="22" r="4.8" fill="#633e1a" stroke="#1f1a16" stroke-width="0.8"/>
    <circle cx="22" cy="22" r="3" fill="#1f1a16"/>
    <!-- Iron Linchpin key -->
    <rect x="21" y="18" width="2" height="8" rx="0.5" fill="#e2d7c3" stroke="#1f1a16" stroke-width="0.5"/>
  </g>
</svg>
