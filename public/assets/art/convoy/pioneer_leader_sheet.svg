<svg xmlns="http://www.w3.org/2000/svg" width="120" height="45" viewBox="0 0 120 45">
  <!-- Frame 0: Left stride forward (30x45) -->
  <g id="leader-0" transform="translate(0, 0)">
    <!-- Walking staff / trail whip -->
    <line x1="22" y1="12" x2="25" y2="44" stroke="#4a2c0f" stroke-width="1.8"/>
    <!-- Rear leg (right) pushing back -->
    <path d="M 13 26 L 8 42 L 12 42 L 16 26 Z" fill="#382e26" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="7" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/> <!-- Boot -->
    <!-- Front leg (left) swinging forward -->
    <path d="M 16 26 L 20 42 L 25 42 L 19 26 Z" fill="#4a3e35" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="20" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Torso: flannel shirt & dark vest -->
    <path d="M 11 16 L 19 16 L 18 27 L 12 27 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1.2"/> <!-- Red flannel -->
    <path d="M 12 18 L 14 27 M 17 18 L 16 27" stroke="#1f1a16" stroke-width="1"/> <!-- Suspenders -->
    <!-- Right arm swinging back -->
    <path d="M 11 17 L 7 24 L 9 26 L 13 19 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <!-- Left arm holding staff -->
    <path d="M 17 17 L 22 23 L 24 22 L 19 17 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <circle cx="22.5" cy="22.5" r="1.5" fill="#e8c4a0"/> <!-- Hand -->
    <!-- Head & Beard -->
    <circle cx="15" cy="12" r="3.5" fill="#e8c4a0"/>
    <path d="M 13 12 C 13 16, 17 16, 17 12 Z" fill="#4a3222"/> <!-- Beard -->
    <!-- Slouch Hat -->
    <ellipse cx="15" cy="9" rx="8" ry="1.8" fill="#1f1a16"/> <!-- Brim -->
    <rect x="12" y="5" width="6" height="4" rx="1" fill="#382e26" stroke="#1f1a16" stroke-width="1"/>
  </g>

  <!-- Frame 1: Mid-step pass (30x45) -->
  <g id="leader-1" transform="translate(30, 0)">
    <line x1="22" y1="13" x2="24" y2="44" stroke="#4a2c0f" stroke-width="1.8"/>
    <!-- Right leg passing under -->
    <path d="M 14 26 L 13 42 L 17 42 L 17 26 Z" fill="#382e26" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="13" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Left leg planting -->
    <path d="M 15 26 L 17 42 L 21 42 L 18 26 Z" fill="#4a3e35" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="17" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <path d="M 11 17 L 19 17 L 18 28 L 12 28 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 12 19 L 14 28 M 17 19 L 16 28" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 11 18 L 10 25 L 12 26 L 13 20 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 17 18 L 22 24 L 24 23 L 19 18 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <circle cx="22.5" cy="23.5" r="1.5" fill="#e8c4a0"/>
    <circle cx="15" cy="13" r="3.5" fill="#e8c4a0"/>
    <path d="M 13 13 C 13 17, 17 17, 17 13 Z" fill="#4a3222"/>
    <ellipse cx="15" cy="10" rx="8" ry="1.8" fill="#1f1a16"/>
    <rect x="12" y="6" width="6" height="4" rx="1" fill="#382e26" stroke="#1f1a16" stroke-width="1"/>
  </g>

  <!-- Frame 2: Right stride forward (30x45) -->
  <g id="leader-2" transform="translate(60, 0)">
    <line x1="22" y1="12" x2="23" y2="44" stroke="#4a2c0f" stroke-width="1.8"/>
    <!-- Left leg pushing back -->
    <path d="M 14 26 L 9 42 L 13 42 L 17 26 Z" fill="#4a3e35" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="8" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Right leg swinging forward -->
    <path d="M 15 26 L 19 42 L 24 42 L 18 26 Z" fill="#382e26" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="19" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <path d="M 11 16 L 19 16 L 18 27 L 12 27 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 12 18 L 14 27 M 17 18 L 16 27" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 11 17 L 13 24 L 15 24 L 14 18 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 17 17 L 22 22 L 24 21 L 19 17 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <circle cx="22.5" cy="21.5" r="1.5" fill="#e8c4a0"/>
    <circle cx="15" cy="12" r="3.5" fill="#e8c4a0"/>
    <path d="M 13 12 C 13 16, 17 16, 17 12 Z" fill="#4a3222"/>
    <ellipse cx="15" cy="9" rx="8" ry="1.8" fill="#1f1a16"/>
    <rect x="12" y="5" width="6" height="4" rx="1" fill="#382e26" stroke="#1f1a16" stroke-width="1"/>
  </g>

  <!-- Frame 3: Mid-step pass opposite (30x45) -->
  <g id="leader-3" transform="translate(90, 0)">
    <line x1="22" y1="13" x2="24" y2="44" stroke="#4a2c0f" stroke-width="1.8"/>
    <!-- Left leg passing under -->
    <path d="M 14 26 L 15 42 L 19 42 L 17 26 Z" fill="#4a3e35" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="15" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <!-- Right leg planting -->
    <path d="M 15 26 L 16 42 L 20 42 L 18 26 Z" fill="#382e26" stroke="#1f1a16" stroke-width="1.2"/>
    <rect x="16" y="40" width="5" height="3" rx="0.5" fill="#1f1a16"/>
    <path d="M 11 17 L 19 17 L 18 28 L 12 28 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1.2"/>
    <path d="M 12 19 L 14 28 M 17 19 L 16 28" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 11 18 L 8 24 L 10 25 L 12 19 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <path d="M 17 18 L 22 23 L 24 22 L 19 18 Z" fill="#8c3327" stroke="#1f1a16" stroke-width="1"/>
    <circle cx="22.5" cy="22.5" r="1.5" fill="#e8c4a0"/>
    <circle cx="15" cy="13" r="3.5" fill="#e8c4a0"/>
    <path d="M 13 13 C 13 17, 17 17, 17 13 Z" fill="#4a3222"/>
    <ellipse cx="15" cy="10" rx="8" ry="1.8" fill="#1f1a16"/>
    <rect x="12" y="6" width="6" height="4" rx="1" fill="#382e26" stroke="#1f1a16" stroke-width="1"/>
  </g>
</svg>
