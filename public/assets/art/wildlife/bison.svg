<svg xmlns="http://www.w3.org/2000/svg" width="90" height="60" viewBox="0 0 90 60">
  <defs>
    <filter id="wildlife-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#1f1a16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="bison" filter="url(#wildlife-shadow)">
    <!-- Back legs (in shadow) -->
    <path d="M 64 34 L 66 52 L 61 52 L 60 36 Z" fill="#2b1a0e" stroke="#18110b" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 66 50 L 66 54 L 60 54 L 61 50 Z" fill="#18110b"/> <!-- Hoof -->

    <path d="M 28 34 L 27 52 L 23 52 L 25 34 Z" fill="#2b1a0e" stroke="#18110b" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 28 50 L 27 54 L 22 54 L 23 50 Z" fill="#18110b"/> <!-- Hoof -->

    <!-- Tail with heavy tuft -->
    <path d="M 72 24 C 75 28, 76 34, 75 39" fill="none" stroke="#2b1a0e" stroke-width="2" stroke-linecap="round"/>
    <path d="M 73 37 C 76 40, 77 44, 75 46 C 73 45, 72 41, 73 37 Z" fill="#18110b"/>

    <!-- Hindquarters & Flank -->
    <path d="M 45 20 C 58 20, 70 21, 72 26 C 74 31, 71 39, 66 40 C 58 41, 48 38, 44 36 Z"
          fill="#3d2614" stroke="#18110b" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Engraving shadow hatch on rear flank -->
    <path d="M 60 25 C 64 28, 66 33, 64 37" fill="none" stroke="#201309" stroke-width="1.2"/>
    <path d="M 54 26 C 58 30, 59 34, 57 38" fill="none" stroke="#201309" stroke-width="1"/>
    <path d="M 66 28 L 63 35 M 69 30 L 66 36" stroke="#201309" stroke-width="0.8"/>

    <!-- Forelegs (foreground) -->
    <path d="M 36 34 L 35 53 L 30 53 L 32 35 Z" fill="#3d2614" stroke="#18110b" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 36 51 L 35 55 L 29 55 L 30 51 Z" fill="#18110b"/> <!-- Hoof -->

    <path d="M 56 34 L 58 53 L 53 53 L 52 35 Z" fill="#3d2614" stroke="#18110b" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 58 51 L 58 55 L 52 55 L 53 51 Z" fill="#18110b"/> <!-- Hoof -->

    <!-- Shaggy Forequarters & Massive Shoulder Hump -->
    <path d="M 22 34 C 22 24, 25 15, 32 10 C 38 6, 44 8, 47 12 C 50 16, 48 24, 46 34 C 42 38, 30 42, 22 34 Z"
          fill="#4a2e18" stroke="#18110b" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Woodcut fur contours on hump & chest -->
    <path d="M 33 11 C 37 8, 42 9, 44 13" fill="none" stroke="#684224" stroke-width="1.4"/>
    <path d="M 28 17 C 32 14, 39 15, 42 20" fill="none" stroke="#684224" stroke-width="1.2"/>
    <path d="M 26 24 C 30 21, 38 23, 40 28" fill="none" stroke="#684224" stroke-width="1.2"/>
    <path d="M 24 30 C 27 27, 33 28, 36 33" fill="none" stroke="#2b1a0e" stroke-width="1.2"/>

    <!-- Shaggy Apron / Beard below neck -->
    <path d="M 14 36 C 18 42, 24 45, 28 42 C 29 38, 25 35, 23 34 Z"
          fill="#25160a" stroke="#18110b" stroke-width="1.4"/>
    <path d="M 17 38 L 22 43 M 20 37 L 25 42" stroke="#18110b" stroke-width="1"/>

    <!-- Lowered Head and Muzzle -->
    <!-- Far horn -->
    <path d="M 18 16 C 18 10, 22 8, 24 9 C 23 11, 20 12, 19 16 Z" fill="#d9d0be" stroke="#18110b" stroke-width="1"/>
    <!-- Head mass -->
    <path d="M 12 24 C 10 18, 14 14, 20 15 C 24 16, 26 22, 24 28 C 21 32, 15 31, 12 24 Z"
          fill="#331f10" stroke="#18110b" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Near horn (curved, dark tipped) -->
    <path d="M 16 18 C 15 10, 20 6, 23 8 C 21 10, 18 12, 17 18 Z" fill="#e5dec9" stroke="#18110b" stroke-width="1.2"/>
    <path d="M 20 7 C 22 7, 23 8, 22 9 Z" fill="#18110b"/> <!-- Horn tip -->

    <!-- Broad Blunt Snout / Muzzle -->
    <path d="M 8 26 C 7 24, 9 22, 13 22 C 14 25, 13 28, 10 28 C 8 28, 7 27, 8 26 Z"
          fill="#1c1109" stroke="#18110b" stroke-width="1.2"/>
    <circle cx="9.5" cy="25" r="0.8" fill="#000"/> <!-- Nostril -->

    <!-- Eye in deep socket -->
    <circle cx="15.5" cy="19.5" r="1.2" fill="#000"/>
    <path d="M 14 18 C 15 17, 17 17, 18 18" fill="none" stroke="#684224" stroke-width="0.8"/>
  </g>
</svg>
