<svg xmlns="http://www.w3.org/2000/svg" width="40" height="35" viewBox="0 0 40 35">
  <defs>
    <filter id="rabbit-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#1f1a16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="rabbit" filter="url(#rabbit-shadow)">
    <!-- Back paw (flat on turf) -->
    <path d="M 23 30 L 33 30 C 33 29, 31 28, 28 28 L 23 28 Z" fill="#755638" stroke="#1f1710" stroke-width="0.8"/>

    <!-- Large Crouched Hind Haunch -->
    <path d="M 22 17 C 28 17, 33 20, 32 26 C 31 30, 24 30, 21 28 C 19 25, 19 19, 22 17 Z"
          fill="#8f6b47" stroke="#1f1710" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- Haunch fur hatching -->
    <path d="M 25 19 C 28 21, 29 24, 28 27" fill="none" stroke="#5a3f25" stroke-width="0.8"/>
    <path d="M 22 21 C 25 23, 26 26, 25 28" fill="none" stroke="#5a3f25" stroke-width="0.6"/>

    <!-- Fluffy Cotton Tail -->
    <circle cx="34" cy="22" r="3" fill="#f8f4ee" stroke="#1f1710" stroke-width="0.8"/>

    <!-- Forebody / Torso -->
    <path d="M 12 21 C 12 18, 16 17, 23 18 C 24 22, 23 26, 18 27 C 14 27, 12 25, 12 21 Z"
          fill="#8f6b47" stroke="#1f1710" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- Pale chest/belly -->
    <path d="M 14 23 C 16 22, 19 22, 21 24 C 19 26, 15 26, 14 23 Z" fill="#e6dcce"/>

    <!-- Front Paw -->
    <path d="M 13 26 L 12 30 L 9 30 L 11 26 Z" fill="#8f6b47" stroke="#1f1710" stroke-width="0.8"/>

    <!-- Head -->
    <path d="M 9 17 C 7 14, 11 11, 14 13 C 16 15, 15 18, 13 20 C 11 21, 9 20, 9 17 Z"
          fill="#8f6b47" stroke="#1f1710" stroke-width="1" stroke-linejoin="round"/>
    <!-- Pale cheek & dark nose -->
    <path d="M 9 17 C 8 16, 8 18, 9 18 Z" fill="#e6dcce"/>
    <circle cx="7.8" cy="16.8" r="0.6" fill="#1f1710"/>

    <!-- Eye -->
    <circle cx="11.5" cy="14.5" r="1" fill="#1f1710"/>
    <circle cx="11.3" cy="14.2" r="0.3" fill="#ffffff"/>

    <!-- Long Tall Ears (Prairie Jackrabbit hallmark) -->
    <!-- Far ear -->
    <path d="M 12 12 C 10 7, 10 3, 12 2 C 13 3, 14 7, 14 12 Z" fill="#755638" stroke="#1f1710" stroke-width="0.8"/>
    <!-- Near ear (longer, pinkish-buff interior, black tip) -->
    <path d="M 14 13 C 13 7, 14 2, 17 2 C 18 4, 17 8, 16 13 Z" fill="#8f6b47" stroke="#1f1710" stroke-width="0.9"/>
    <path d="M 15 11 C 14 7, 15 4, 16.5 4 C 17 6, 16.5 9, 16 11 Z" fill="#d9baa7"/> <!-- Ear inside -->
    <path d="M 16 2 C 17 2, 17 3, 16.5 4 C 15.5 4, 15.5 3, 16 2 Z" fill="#1f1710"/> <!-- Black ear tip -->
  </g>
</svg>
