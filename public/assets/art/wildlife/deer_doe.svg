<svg xmlns="http://www.w3.org/2000/svg" width="70" height="65" viewBox="0 0 70 65">
  <defs>
    <filter id="deer-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#1f1a16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g id="deer" filter="url(#deer-shadow)">
    <!-- Back legs (in shadow) -->
    <path d="M 48 36 L 50 56 L 47 56 L 45 38 Z" fill="#664728" stroke="#1f160e" stroke-width="1" stroke-linejoin="round"/>
    <path d="M 50 54 L 50 58 L 46 58 L 47 54 Z" fill="#1f160e"/> <!-- Hoof -->

    <path d="M 23 36 L 22 56 L 19 56 L 21 38 Z" fill="#664728" stroke="#1f160e" stroke-width="1" stroke-linejoin="round"/>
    <path d="M 22 54 L 22 58 L 18 58 L 19 54 Z" fill="#1f160e"/> <!-- Hoof -->

    <!-- Upturned White Tail (flagging white undertail) -->
    <path d="M 53 27 C 58 24, 61 22, 60 27 C 59 32, 55 33, 51 31 Z"
          fill="#f4efe6" stroke="#1f160e" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 52 26 C 56 25, 57 26, 56 29" fill="none" stroke="#b0997e" stroke-width="0.8"/>

    <!-- Body Torso / Barrel -->
    <path d="M 21 28 C 21 23, 27 21, 38 21 C 48 21, 53 23, 53 29 C 53 36, 46 39, 36 38 C 26 38, 21 34, 21 28 Z"
          fill="#875d36" stroke="#1f160e" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- Pale / Cream Belly Swathe -->
    <path d="M 28 34 C 33 32, 41 32, 46 34 C 44 37, 34 38, 28 34 Z"
          fill="#dfd3be" stroke="#1f160e" stroke-width="0.8"/>

    <!-- Woodcut contour shading on haunch -->
    <path d="M 45 25 C 48 28, 49 32, 47 35" fill="none" stroke="#5a3b20" stroke-width="1"/>
    <path d="M 41 24 C 44 27, 45 31, 43 34" fill="none" stroke="#5a3b20" stroke-width="0.8"/>

    <!-- Foreground Legs -->
    <path d="M 44 37 L 46 58 L 43 58 L 41 39 Z" fill="#875d36" stroke="#1f160e" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 46 56 L 46 60 L 42 60 L 43 56 Z" fill="#1f160e"/> <!-- Hoof -->

    <path d="M 27 37 L 27 58 L 24 58 L 25 39 Z" fill="#875d36" stroke="#1f160e" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 27 56 L 27 60 L 23 60 L 24 56 Z" fill="#1f160e"/> <!-- Hoof -->

    <!-- Graceful Slender Neck (raised alert posture) -->
    <path d="M 23 30 L 16 16 L 21 14 L 27 26 Z"
          fill="#875d36" stroke="#1f160e" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Throat patch (cream) -->
    <path d="M 18 20 C 19 17, 21 16, 22 18 C 22 22, 20 24, 18 20 Z" fill="#dfd3be"/>

    <!-- Alert Head -->
    <path d="M 17 17 C 15 14, 11 15, 8 18 C 10 20, 14 21, 17 19 Z"
          fill="#875d36" stroke="#1f160e" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Cream muzzle & black nose button -->
    <path d="M 8 18 C 7 17, 6 18, 6 19 C 7 20, 9 20, 9 19 Z" fill="#dfd3be"/>
    <circle cx="6.5" cy="18.5" r="0.8" fill="#1f160e"/>

    <!-- Alert Eye -->
    <circle cx="12.5" cy="16.5" r="1.1" fill="#1f160e"/>
    <circle cx="12.3" cy="16.2" r="0.4" fill="#ffffff"/>

    <!-- Alert Ears (cupped) -->
    <path d="M 18 14 C 20 10, 23 9, 22 13 C 21 15, 19 15, 18 14 Z" fill="#875d36" stroke="#1f160e" stroke-width="1"/>
    <path d="M 19 13 C 20 11, 21 11, 21 13 Z" fill="#dfd3be"/> <!-- Ear interior -->

  </g>
</svg>
